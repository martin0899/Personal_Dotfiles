# Starship config - Gruvbox Material Dark Medium
# Colores homologados con Kitty

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[palettes.gruvbox]
bg = "#282828"
fg = "#d4be98"
red = "#ea6962"
green = "#a9b665"
yellow = "#d8a657"
orange = "#e78a4e"
blue = "#7daea3"
magenta = "#d3869b"
cyan = "#89b482"
gray = "#928374"
dark = "#665c54"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

[directory]
style = "bold cyan"
read_only = " "
truncation_length = 4
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bold orange"
format = "[$symbol $branch]($style) "

[git_status]
style = "bold red"
format = '[$all_status$ahead_behind]($style) '
modified = "±"
untracked = "?"
stashed = " stash"
deleted = "✘"
staged = "●"
ahead = "⇡${count}"
behind = "⇣${count}"

[nodejs]
symbol = ""
style = "bold green"
format = "[$symbol ($version)]($style) "

[python]
symbol = ""
style = "bold yellow"
format = "[$symbol ($version)]($style) "

[rust]
symbol = ""
style = "bold red"
format = "[$symbol ($version)]($style) "

[docker_context]
symbol = ""
style = "bold cyan"
format = "[$symbol $context]($style) "

[cmd_duration]
min_time = 2_000
style = "bold gray"
format = "[$duration]($style) "

[username]
style_user = "bold yellow"
format = "[$user]($style) "

[hostname]
ssh_only = false
style = "bold yellow"
format = "[@$hostname]($style) "
